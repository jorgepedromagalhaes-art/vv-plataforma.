name: Executar Monitoramento DOU

on:
  workflow_dispatch:
  schedule:
    - cron: '0 5 * * *'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Instalar dependências
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Instalar Navegador Playwright
        run: |
          playwright install chromium

      - name: Executar o Scraper do DOU
        run: python scraper.py

      - name: Salvar resultados no repositório
        run: |
          git config --global user.name 'DOU Bot'
          git config --global user.email 'bot@github.com'
          git add dados.json
          git diff --quiet && git diff --staged --quiet || (git commit -m "Atualização automática DOU" && git push)
